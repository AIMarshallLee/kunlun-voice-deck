; PlatformIO Project Configuration for M5Stack CoreS3 (Kunlun Voice Deck)
[env:m5stack-cores3]
platform = espressif32@6.5.0
board = esp32s3box
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DKUNLUN_VERSION=\"1.0.0\"

lib_deps =
    m5stack/M5Unified@^0.1.16
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

; Phase 2 网络配置：建议在本地复制为 platformio.local.ini 或通过环境变量覆盖，勿把凭据提交入库
;    -DKUNLUN_WIFI_SSID=\"YourSSID\"
;    -DKUNLUN_WIFI_PASS=\"YourPassword\"
;    -DKUNLUN_BRIDGE_HOST=\"192.168.1.100\"
;    -DKUNLUN_BRIDGE_PORT=8765
